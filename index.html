<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WL Emergency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #14101d;
  --bg-soft: #1b1526;
  --surface: #221a33;
  --surface-2: #2a2140;
  --border: #362a52;
  --text: #ece7f7;
  --muted: #a89bc4;
  --muted-2: #7c6f9c;
  --accent: #8b5cf6;
  --accent-2: #b794f6;
  --accent-deep: #5b21b6;
  --green: #34d399;
  --red: #f87171;
  --orange: #fbbf24;
  --black-status: #71717a;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: radial-gradient(1200px 600px at 80% -10%, #2a1d47 0%, transparent 60%), var(--bg);
  color: var(--text);
  font-family:'Tajawal', sans-serif;
  min-height:100vh;
  line-height:1.6;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent-deep);color:#fff;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:8px;}

/* ===== layout shell ===== */
#app{min-height:100vh;display:flex;flex-direction:column;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
@media(max-width:640px){.container{padding:0 16px;}}

/* ===== topbar ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(20,16,29,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:68px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.2px;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(145deg, var(--accent), var(--accent-deep));
  display:flex;align-items:center;justify-content:center;
  font-family:'Almarai',sans-serif;font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 4px 14px rgba(139,92,246,.4);
}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{
  padding:9px 14px;border-radius:9px;font-size:14.5px;color:var(--muted);
  transition:background .15s,color .15s;
}
.nav-links a:hover,.nav-links a.active{background:var(--surface);color:var(--text);}
.nav-cta{display:flex;align-items:center;gap:10px;}
.btn{
  padding:10px 18px;border-radius:10px;border:none;font-size:14.5px;font-weight:700;
  transition:transform .12s,box-shadow .12s,background .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(145deg,var(--accent),var(--accent-deep));color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.35);}
.btn-primary:hover{box-shadow:0 8px 22px rgba(139,92,246,.5);}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:6px 12px 6px 6px;border-radius:30px;cursor:pointer;}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,var(--accent-2),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;}

/* mobile nav */
.mobile-menu{display:none;}
@media(max-width:900px){
  .nav-links{display:none;}
  .hamburger{display:block;}
  .mobile-menu.open{display:flex;flex-direction:column;gap:2px;padding:10px 16px 16px;border-top:1px solid var(--border);}
  .mobile-menu a{padding:11px 10px;border-radius:8px;color:var(--muted);}
  .mobile-menu a.active{background:var(--surface);color:var(--text);}
}

main{flex:1;}

/* ===== hero ===== */
.hero{
  position:relative;overflow:hidden;
  padding:70px 0 60px;
  border-bottom:1px solid var(--border);
  background:
    radial-gradient(700px 300px at 15% 0%, rgba(139,92,246,.18), transparent 60%),
    radial-gradient(900px 500px at 100% 20%, rgba(91,33,182,.25), transparent 55%);
}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;}}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--accent-2);background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);padding:6px 12px;border-radius:20px;margin-bottom:18px;}
.dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55);}70%{box-shadow:0 0 0 8px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
.hero h1{font-size:44px;font-weight:800;line-height:1.25;margin:0 0 16px;font-family:'Almarai',sans-serif;}
.hero h1 span{color:var(--accent-2);}
.hero p{color:var(--muted);font-size:16.5px;max-width:520px;margin:0 0 28px;}
@media(max-width:640px){.hero h1{font-size:31px;}}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}

.hero-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);
}
.hero-banner{
  height:110px;border-radius:10px;margin-bottom:18px;
  background:
    repeating-linear-gradient(135deg, rgba(139,92,246,.16) 0 2px, transparent 2px 14px),
    linear-gradient(120deg, var(--accent-deep), #1b1130 70%);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
}
.hero-banner .bmark{font-family:'Almarai',sans-serif;font-weight:800;font-size:22px;letter-spacing:1px;color:#fff;opacity:.9;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;}
.stat-row:last-child{border-bottom:none;}
.stat-row .label{color:var(--muted);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:700;}
.badge-green{background:rgba(52,211,153,.14);color:var(--green);}
.badge-red{background:rgba(248,113,113,.14);color:var(--red);}
.badge-orange{background:rgba(251,191,36,.14);color:var(--orange);}
.badge-black{background:rgba(113,113,122,.18);color:#d4d4d8;}
.badge-purple{background:rgba(139,92,246,.16);color:var(--accent-2);}

/* section generic */
.section{padding:56px 0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:24px;font-weight:800;margin:0;font-family:'Almarai',sans-serif;}
.section-head p{color:var(--muted);margin:6px 0 0;font-size:14px;}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media(max-width:900px){.quick-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.quick-grid{grid-template-columns:1fr;}}
.qcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;transition:border-color .15s,transform .15s;
}
.qcard:hover{border-color:var(--accent);transform:translateY(-3px);}
.qcard .qi{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:18px;}
.qcard h3{margin:0 0 6px;font-size:15.5px;}
.qcard p{margin:0;color:var(--muted);font-size:13px;}

footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted-2);font-size:13.5px;}
.footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center;}

/* cards / generic surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
.tab{padding:11px 16px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
.tab.active{color:var(--text);border-color:var(--accent);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:7px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;
  padding:11px 13px;color:var(--text);font-family:inherit;font-size:14.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:12.5px;}
tr:hover td{background:rgba(255,255,255,.015);}
.table-wrap{overflow-x:auto;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ei{font-size:34px;margin-bottom:10px;}

.profile-head{display:flex;align-items:center;gap:18px;margin-bottom:26px;flex-wrap:wrap;}
.profile-av{width:74px;height:74px;border-radius:20px;background:linear-gradient(145deg,var(--accent-2),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;}
.stat-mini{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat-mini .n{font-size:22px;font-weight:800;font-family:'Almarai',sans-serif;}
.stat-mini .l{font-size:12.5px;color:var(--muted);margin-top:4px;}

.pill-status{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;}

.q-block{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.q-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-top:6px;border:1px solid transparent;cursor:pointer;}
.q-opt:hover{background:rgba(255,255,255,.03);}
.q-opt.sel{border-color:var(--accent);background:rgba(139,92,246,.1);}
.timer-box{position:sticky;top:80px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;}
.timer-box .tv{font-size:30px;font-weight:800;font-family:'Almarai',sans-serif;color:var(--accent-2);}

.stream-card,.news-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.thumb{height:150px;background:linear-gradient(135deg,#241a3b,#3b2360);display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;}
.live-tag{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;display:flex;align-items:center;gap:4px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-3{grid-template-columns:1fr;}}

.rule-cat{margin-bottom:26px;}
.rule-cat h3{font-size:16.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.rule-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:8px;font-size:14px;color:#ded7ef;}

.stack{display:flex;flex-direction:column;gap:12px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,7,16,.65);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;max-width:440px;width:100%;box-shadow:var(--shadow);}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--accent);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:200;box-shadow:var(--shadow);}

.sidebar-admin{display:grid;grid-template-columns:220px 1fr;gap:22px;}
@media(max-width:800px){.sidebar-admin{grid-template-columns:1fr;}}
.side-nav{display:flex;flex-direction:column;gap:2px;}
.side-nav a{padding:10px 14px;border-radius:9px;color:var(--muted);font-size:14px;}
.side-nav a.active,.side-nav a:hover{background:var(--surface);color:var(--text);}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
@media(max-width:800px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
.linked-flag{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);border-radius:10px;padding:12px 14px;font-size:13px;color:#fca5a5;margin-top:8px;}
.audit-item{padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;display:flex;gap:10px;}
.audit-item .t{color:var(--muted-2);font-size:12px;white-space:nowrap;}
.chip-small{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--muted);}
.notice{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.3);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--accent-2);}

/* ===== added: accordion (rules) ===== */
.accordion{display:flex;flex-direction:column;gap:10px;}
.acc-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;font-weight:700;font-size:15px;}
.acc-head:hover{background:var(--surface-2);}
.acc-head-left{display:flex;align-items:center;gap:10px;}
.acc-count{font-size:12px;color:var(--muted);font-weight:400;}
.acc-chevron{transition:transform .2s;color:var(--muted);}
.acc-item.open .acc-chevron{transform:rotate(180deg);}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.acc-item.open .acc-body{max-height:3000px;}
.acc-body-inner{padding:0 18px 16px;}
.acc-rule{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:14px;color:#ded7ef;}
.acc-rule:first-child{border-top:none;}
.acc-rule .num{color:var(--accent-2);font-weight:800;min-width:22px;}

/* ===== added: role & link badges ===== */
.role-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:14px;font-size:11.5px;font-weight:700;}
.role-user{background:rgba(168,155,196,.15);color:var(--muted);}
.role-staff{background:rgba(139,92,246,.16);color:var(--accent-2);}
.role-admin{background:rgba(251,191,36,.15);color:var(--orange);}
.link-yes{color:var(--green);font-weight:700;}
.link-no{color:var(--red);font-weight:700;}

/* ===== added: discord embed preview (mock) ===== */
.embed-card{background:#1a1626;border-inline-start:4px solid var(--accent);border-radius:10px;padding:16px 18px;font-size:13.5px;max-width:440px;}
.embed-title{font-weight:800;margin-bottom:12px;font-size:14.5px;}
.embed-row{display:flex;gap:8px;margin-bottom:9px;}
.embed-label{color:var(--muted);min-width:120px;flex-shrink:0;}

/* ===== added: search / admin small forms ===== */
.search-box{display:flex;gap:10px;margin-bottom:18px;}
.search-box input{flex:1;}
.mini-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.mini-form input{flex:1;min-width:140px;}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:12px;color:var(--muted);}
.icon-btn:hover{color:var(--text);}
.result-item{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;cursor:pointer;}
.result-item:hover{border-color:var(--accent);}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.settings-grid{grid-template-columns:1fr;}}
.disabled-note{font-size:12px;color:var(--muted-2);margin-top:4px;}
.event-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap;}
.event-row:last-child{border-bottom:none;}


/* ===== added stage 3: avatar image support ===== */
.av img, .profile-av img { width:100%; height:100%; border-radius:inherit; object-fit:cover; }
.av, .profile-av { overflow:hidden; }
.avatar-upload-row { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.avatar-big { width:64px; height:64px; border-radius:18px; overflow:hidden; background:linear-gradient(145deg,var(--accent-2),var(--accent-deep)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#fff; flex-shrink:0; }
.avatar-big img { width:100%; height:100%; object-fit:cover; }
.file-btn { display:inline-block; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:9px 16px; font-size:13.5px; cursor:pointer; }
.file-btn:hover { border-color:var(--accent); }

/* ===== added stage 3: branches (discord servers) on homepage ===== */
.branches-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media(max-width:900px){.branches-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.branches-grid{grid-template-columns:1fr;}}
.branch-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; transition:border-color .15s, transform .15s; }
.branch-card:hover { border-color:var(--accent); transform:translateY(-3px); }
.branch-icon { font-size:30px; margin-bottom:10px; }
.branch-card h3 { margin:0 0 6px; font-size:15.5px; }
.branch-card p { margin:0 0 14px; color:var(--muted); font-size:13px; min-height:34px; }

/* ===== added stage 3: simple admin manage-list rows (rules/branches/streamers) ===== */
.manage-row { display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin-bottom:8px; flex-wrap:wrap; }
.manage-row input, .manage-row select { background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:7px 10px; color:var(--text); font-size:13px; }
.locked-box { text-align:center; padding:50px 24px; }
.locked-box .li { font-size:36px; margin-bottom:12px; }

</style>
<body>
<div id="app"></div>
<script>
/* =========================================================
   WL EMERGENCY — Stage 3 ("official site" foundations)
   Everything below is now REAL and persisted server-side:
   accounts (with email), avatars, rules, branches (Discord
   servers), site settings, and the activation test (graded
   on the server, 1-hour cooldown after a fail, admin can
   lock it). Every account event is logged and forwarded to
   Discord via Webhook if configured.

   STILL PENDING (Batch 2 — needs live external platform APIs):
   real stream live-detection (YouTube/Twitch/Kick/TikTok),
   real Roblox online-player count, and an always-on Discord
   Bot that can actually grant a role (a Webhook can only post
   messages, not manage roles).
   ========================================================= */

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'حدث خطأ غير متوقع'); err.data = data; throw err; }
  return data;
}

/* ================= STATE ================= */
const STATE = {
  route: "home", currentUser: null, mobileMenuOpen: false, authTab: "login",
  profileTab: "overview", adminTab: "overview",
  openRuleSections: {}, testState: null, timerHandle: null, toast: null,
  searchQuery: "", searchResults: [], recordsView: null, editingRule: null,
  adminStats: null, serverActivity: [], showLogoutConfirm: false, securityLogs: [],
  rules: [], branches: [], publicSettings: null, adminSettings: null, streamers: [],
  liveStreams: []
};

function toast(msg) { STATE.toast = msg; render(); setTimeout(() => { STATE.toast = null; render(); }, 2800); }
function navigate(route) {
  if (route === 'admin' && !canAccessAdmin(STATE.currentUser)) { toast('هذا القسم للطاقم والإدارة فقط'); route = 'home'; }
  STATE.route = route; STATE.mobileMenuOpen = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();

/* ================= AVATAR UPLOAD ================= */
function triggerAvatarPick() { document.getElementById('avatar-file-input').click(); }
function onAvatarSelected(input) {
  const file = input.files[0];
  if (!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e) => { img.src = e.target.result; };
  img.onload = async () => {
    const size = 220;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    try { const { user } = await api('/api/me/avatar', { method: 'POST', body: JSON.stringify({ imageDataUrl: dataUrl }) }); STATE.currentUser = user; toast('تم تحديث الصورة'); render(); }
    catch (err) { toast(err.message); }
  };
  reader.readAsDataURL(file);
}

/* ================= ACTIVATION TEST (server-graded) ================= */
async function startTest() {
  const u = STATE.currentUser; if (!u) { toast('سجّل الدخول أولاً'); return; }
  if (!u.discordLinked || !u.robloxLinked) { toast('اربط Discord و Roblox أولًا'); return; }
  try {
    const data = await api('/api/test/start', { method: 'POST' });
    STATE.testState = { attemptId: data.attemptId, questions: data.questions, answers: new Array(data.questions.length).fill(null), submitted: false, result: null, timeLeft: data.durationMinutes * 60 };
    clearInterval(STATE.timerHandle);
    STATE.timerHandle = setInterval(() => {
      if (!STATE.testState || STATE.testState.submitted) { clearInterval(STATE.timerHandle); return; }
      STATE.testState.timeLeft--;
      if (STATE.testState.timeLeft <= 0) finishTest(); else renderTimerOnly();
    }, 1000);
    render();
  } catch (e) {
    if (e.data && e.data.closed) { STATE.testClosedMsg = e.message; render(); }
    else toast(e.message);
  }
}
function selectAnswer(qIdx, optIdx) { if (!STATE.testState || STATE.testState.submitted) return; STATE.testState.answers[qIdx] = optIdx; render(); }
async function finishTest() {
  const ts = STATE.testState; if (!ts || ts.submitted) return;
  clearInterval(STATE.timerHandle);
  try {
    const result = await api('/api/test/submit', { method: 'POST', body: JSON.stringify({ attemptId: ts.attemptId, answers: ts.answers }) });
    ts.submitted = true; ts.result = result;
    const { user } = await api('/api/me'); STATE.currentUser = user;
  } catch (e) { toast(e.message); }
  render();
}
function renderTimerOnly() { const el = document.getElementById('timer-val'); if (el && STATE.testState) el.textContent = fmtTime(STATE.testState.timeLeft); }

        <div class="stat-mini"><div class="n">${best && best.passed ? '✅' : '—'}</div><div class="l">اجتياز الاختبار</div></div>
      </div>
    </div>`;
  }

    return `<div class="grid-2">
      <div class="card"><h3 style="margin-top:0;">Discord</h3>
        <div class="stat-row"><span class="label">الحالة</span>${linkBadge(u.discordLinked)}</div>
        <div class="stat-row"><span class="label">Username</span><b>${u.discordUsername || '—'}</b></div>
        <div class="stat-row"><span class="label">Discord ID</span><b>${u.discordId || '—'}</b></div>

      </div>
      <div class="card"><h3 style="margin-top:0;">Roblox</h3>
        <div class="stat-row"><span class="label">الحالة</span>${linkBadge(u.robloxLinked)}</div>
        <div class="stat-row"><span class="label">Username</span><b>${u.robloxUsername || '—'}</b></div>
        <div class="stat-row"><span class="label">Display Name</span><b>${u.robloxDisplayName || '—'}</b></div>
        <div class="stat-row"><span class="label">Roblox ID</span><b>${u.robloxId || '—'}</b></div>
        ${u.robloxLinked ? `<button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="unlinkAccount('roblox')">إلغاء الربط</button>` : `<a class="btn btn-primary btn-sm" style="margin-top:10px;display:inline-block;" href="/auth/roblox/start">ربط حساب Roblox</a>`}
      </div>
    </div>`;
  }
  if (STATE.profileTab === 'test') return pageTestInner(u);

    const log = STATE.serverActivity || [];
    return `<div class="card"><h3 style="margin-top:0;">النشاطات</h3>${log.length ? log.map(a => `<div class="audit-item"><span class="t">${a.time}</span><span>${a.text}</span></div>`).join('') : emptyState('🕓', 'لا يوجد نشاط بعد', '')}</div>`;

  return '';
}

/* ---- ACTIVATION TEST ---- */
function pageTest() { if (!STATE.currentUser) return pageLogin(); STATE.profileTab = 'test'; return pageProfile(); }
function pageTestInner(u) {
  const s = STATE.publicSettings;
  if (s && !s.testOpen) {
    return `<div class="locked-box"><div class="li">🔒</div><h3>الاختبار مغلق حاليًا</h3>
      <p style="color:var(--muted);max-width:420px;margin:10px auto 18px;">لمعرفة الأسباب أو مواعيد فتح التفعيل، تواجه لسيرفرنا الأساسي على Discord.</p>
      ${s.primaryDiscordInvite ? `<a class="btn btn-primary" href="${s.primaryDiscordInvite}" target="_blank">فتح Discord</a>` : ''}
    </div>`;
  }
  if (!u.discordLinked || !u.robloxLinked) {
    return `<div class="card" style="text-align:center;padding:36px 24px;">
      <div style="font-size:30px;margin-bottom:10px;">🔗</div><h3 style="margin:0 0 8px;">أكمل ربط حساباتك أولًا</h3>
      <p style="color:var(--muted);max-width:420px;margin:0 auto 18px;">يجب ربط حسابي Discord و Roblox قبل دخول اختبار التفعيل الإلكتروني.</p>
      <button class="btn btn-primary btn-sm" onclick="setProfileTab('linked')">اذهب لربط الحسابات</button>
    </div>`;
  }
  if (STATE.testClosedMsg) { const msg = STATE.testClosedMsg; STATE.testClosedMsg = null; toast(msg); }
  if (!STATE.testState) {
    const last = (u.testAttempts || [])[0];
    return `<div class="card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:32px;margin-bottom:10px;">🧠</div><h3 style="margin:0 0 8px;">اختبار التفعيل الإلكتروني</h3>
      <p style="color:var(--muted);max-width:440px;margin:0 auto 20px;">${s ? s.numQuestions : '—'} سؤال · مدة الاختبار ${s ? s.testDurationMinutes : '—'} دقيقة · نسبة النجاح ${s ? s.passPercent : '—'}%.</p>
      ${last ? `<div class="notice" style="margin-bottom:16px;">آخر محاولة: ${last.score}/${last.total} (${last.percent}%) — ${last.passed ? 'ناجح ✅' : 'راسب 🔴 (لازم تنتظر ساعة قبل إعادة المحاولة)'}</div>` : ''}
      <button class="btn btn-primary" onclick="startTest()">${last ? 'إعادة الاختبار' : 'ابدأ الاختبار'}</button>
    </div>`;
  }
  const ts = STATE.testState;
  if (ts.submitted) {
    const r = ts.result;
    return `<div class="card" style="text-align:center;padding:34px 20px;">
      <div style="font-size:34px;">${r.passed ? '✅' : '🔴'}</div>
      <h3 style="margin:10px 0 4px;">النتيجة: ${r.score} / ${r.total}</h3>
      <div style="font-size:26px;font-weight:800;font-family:'Almarai',sans-serif;color:${r.passed ? 'var(--green)' : 'var(--red)'};">${r.percent}%</div>
      <div style="margin:10px 0;">${r.passed ? '<span class="badge badge-green">🟢 ناجح</span>' : '<span class="badge badge-red">🔴 راسب</span>'}</div>
      <p style="color:var(--muted);font-size:13px;">تم إرسال النتيجة لسجلات الإدارة تلقائيًا.${!r.passed ? ' يمكنك إعادة المحاولة بعد ساعة.' : ''}</p>
    </div>`;
  }
  return `<div class="grid-2">
    <div class="stack">
      ${ts.questions.map((q, i) => `<div class="q-block"><div style="font-weight:700;margin-bottom:8px;">${i + 1}. ${q.q}</div>${q.options.map((op, oi) => `<div class="q-opt ${ts.answers[i] === oi ? 'sel' : ''}" onclick="selectAnswer(${i},${oi})"><span>${ts.answers[i] === oi ? '●' : '○'}</span><span>${op}</span></div>`).join('')}</div>`).join('')}
      <button class="btn btn-primary" style="align-self:flex-start;" onclick="finishTest()">إرسال الاختبار</button>
    </div>
    <div><div class="timer-box"><div style="font-size:12.5px;color:var(--muted);margin-bottom:6px;">الوقت المتبقي</div><div class="tv" id="timer-val">${fmtTime(ts.timeLeft)}</div><div style="font-size:12px;color:var(--muted-2);margin-top:6px;">${ts.answers.filter(a => a !== null).length} / ${ts.questions.length} تمت الإجابة</div></div></div>
  </div>`;
}

  }
  if (STATE.adminTab === 'logs' && isAdmin) {
    const LABELS = { login: ['🟢 تسجيل دخول', 'link-yes'], logout: ['🔴 تسجيل خروج', 'link-no'], link_discord: ['🔗 ربط Discord', 'role-staff'], unlink_discord: ['✂️ إلغاء ربط Discord', 'link-no'], link_roblox: ['🔗 ربط Roblox', 'role-staff'], unlink_roblox: ['✂️ إلغاء ربط Roblox', 'link-no'], role_change: ['🛡️ تغيير صلاحية', 'role-admin'], account_created: ['✨ إنشاء حساب', 'role-user'], test_result: ['🧠 نتيجة اختبار', 'role-staff'] };
    const logs = STATE.securityLogs || [];
    return `<div class="card">
      <div class="between"><h3 style="margin:0;">سجل الأمان</h3><button class="icon-btn" onclick="loadAdminLogs()">🔄 تحديث</button></div>
      <p style="color:var(--muted);font-size:13px;margin-top:6px;">كل عمليات تسجيل الدخول والخروج والربط وإلغاء الربط وتغيير الصلاحيات ونتائج الاختبار، لكل المستخدمين.</p>
      <div class="table-wrap"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الحدث</th><th>التفاصيل</th></tr></thead><tbody>
        ${logs.length ? logs.map(l => { const meta = LABELS[l.type] || ['ℹ️ ' + l.type, 'role-user']; return `<tr><td style="font-size:12px;white-space:nowrap;">${l.time}</td><td onclick="setAdminTab('records');openUserRecord('${l.wlId}')" style="cursor:pointer;color:var(--accent-2);">${l.username}</td><td><span class="role-badge ${meta[1]}">${meta[0]}</span></td><td style="font-size:13px;">${l.text}</td></tr>`; }).join('') : `<tr><td colspan="4" style="color:var(--muted);text-align:center;">لا يوجد نشاط بعد</td></tr>`}
      </tbody></table></div>
    </div>`;
  }
  return '';
}
function userRecordDetail(data, isAdmin) {
  const u = data.user, log = data.activity || [];
  const nextRoles = ['user', 'staff', 'admin'].filter(r => r !== u.role);
  return `<div class="stack">
    <button class="btn btn-ghost btn-sm" style="align-self:flex-start;" onclick="closeUserRecord()">← رجوع للبحث</button>
    <div class="profile-head"><div class="profile-av">${avatarHTML(u)}</div><div><div style="font-size:19px;font-weight:800;">${u.username}</div><div style="color:var(--muted);font-size:13px;">${u.wlId} ${roleBadge(u.role)}</div></div>
      ${isAdmin ? `<div style="margin-inline-start:auto;"><select onchange="if(this.value)changeUserRole('${u.wlId}',this.value)" style="background:var(--bg-soft);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12.5px;"><option value="">تغيير الصلاحية…</option>${nextRoles.map(r => `<option value="${r}">${r}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="grid-2">
      <div class="card"><h3 style="margin-top:0;">معلومات WL</h3><div class="stat-row"><span class="label">WL User ID</span><b>${u.wlId}</b></div><div class="stat-row"><span class="label">البريد</span><b>${u.email || '—'}</b></div><div class="stat-row"><span class="label">تاريخ التسجيل</span><b>${u.createdAt}</b></div><div class="stat-row"><span class="label">آخر تسجيل دخول</span><b>${u.lastLogin}</b></div></div>
      <div class="card"><h3 style="margin-top:0;">Discord</h3><div class="stat-row"><span class="label">Username</span><b>${u.discordUsername || '—'}</b></div><div class="stat-row"><span class="label">Discord ID</span><b>${u.discordId || '—'}</b></div><div class="stat-row"><span class="label">حالة الربط</span>${linkBadge(u.discordLinked)}</div></div>
      <div class="card"><h3 style="margin-top:0;">Roblox</h3><div class="stat-row"><span class="label">Username</span><b>${u.robloxUsername || '—'}</b></div><div class="stat-row"><span class="label">Display Name</span><b>${u.robloxDisplayName || '—'}</b></div><div class="stat-row"><span class="label">Roblox ID</span><b>${u.robloxId || '—'}</b></div><div class="stat-row"><span class="label">حالة الربط</span>${linkBadge(u.robloxLinked)}</div></div>
      <div class="card"><h3 style="margin-top:0;">الاختبارات (${(u.testAttempts || []).length})</h3>${(u.testAttempts || []).length ? u.testAttempts.map(a => `<div class="stat-row"><span class="label">${a.date}</span><b>${a.score}/${a.total} (${a.percent}%) ${a.passed ? '✅' : '🔴'}</b></div>`).join('') : emptyState('📭', 'لا توجد محاولات بعد', '')}</div>
      <div class="card" style="grid-column:1/-1;"><h3 style="margin-top:0;">النشاطات</h3>${log.length ? log.map(a => `<div class="audit-item"><span class="t">${a.time}</span><span>${a.text}</span></div>`).join('') : emptyState('🕓', 'لا يوجد نشاط بعد', '')}</div>
    </div>
  </div>`;
}

/* ---------------- ROUTER ---------------- */
function currentPageHTML() {
  switch (STATE.route) {
    case 'home': return pageHome();
    case 'login': return pageLogin();
    case 'profile': return pageProfile();
    case 'test': return pageTest();
    case 'streams': return pageStreams();
    case 'rules': return pageRules();
    case 'community': return pageCommunity();
    case 'admin': return pageAdmin();
    default: return pageHome();
  }
}
function render() {
  const app = document.getElementById('app');
  app.innerHTML = `${topbar()}<main>${currentPageHTML()}</main>${footer()}${STATE.toast ? `<div class="toast">${STATE.toast}</div>` : ''}${logoutModal()}`;
}
render();
restoreSession();

</script>
</body>
</html>
